name: Build

# Every push to main is built and tested. When the commits since the last vX.Y.Z
# tag contain a releasable conventional commit, the next semver version is
# released with yan.exe attached:
#   fix: / perf:                      -> patch  (1.2.3 -> 1.2.4)
#   feat:                             -> minor  (1.2.3 -> 1.3.0)
#   feat!: / BREAKING CHANGE: footer  -> major  (1.2.3 -> 2.0.0)
# Other types (docs:, ci:, refactor:, chore:, test:, style:, build:) do not release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags

      # Dry run: only compute the next version and changelog; the tag is created
      # after the build and tests pass.
      - name: Compute next version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}
          dry_run: true
          default_bump: false # no feat/fix/breaking commit: no release

      # Tag locally so CMake embeds the new version in yan.exe.
      - name: Tag version locally
        if: steps.version.outputs.new_tag
        shell: bash
        run: git tag "${{ steps.version.outputs.new_tag }}"

      - name: Build (Release)
        shell: cmd
        run: build.cmd

      - name: Run tests
        shell: cmd
        run: build\Release\yan_tests.exe

      - name: Upload yan.exe
        uses: actions/upload-artifact@v4
        with:
          name: yan
          path: build/Release/yan.exe
          if-no-files-found: error

      - name: Publish release
        if: steps.version.outputs.new_tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.version.outputs.changelog }}
        run: |
          tag="${{ steps.version.outputs.new_tag }}"
          git push origin "$tag"
          gh release create "$tag" build/Release/yan.exe --title "Yan $tag" --notes "$NOTES"
